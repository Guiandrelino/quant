[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "brazil-equity-lab"
version = "0.1.0"
description = "Auditable long-only factor research for Brazilian equities"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["numpy>=2.1,<3", "pandas>=2.2,<3", "scipy>=1.14,<2", "plotly>=5.24,<7"]

[project.optional-dependencies]
app = ["streamlit>=1.40,<2"]
dev = ["pytest>=8.3,<9", "ruff>=0.9,<1"]

[project.scripts]
equity-lab = "equity_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
